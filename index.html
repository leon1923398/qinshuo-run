  var headImg = new Image();
  headImg.src = HEAD_SRC;

  /* ---- canvas ---- */
  var canvas = document.getElementById('game');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'game';
    canvas.tabIndex = 0;
    (document.body || document.documentElement).appendChild(canvas);
  }
  canvas.tabIndex = 0;
  canvas.style.display = 'block';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.objectFit = 'contain';
  canvas.style.touchAction = 'none';
  canvas.style.webkitTapHighlightColor = 'transparent';
  canvas.style.outline = 'none';
  canvas.style.background = '#f7f7f2';

  var ctx = canvas.getContext('2d');
  var DPR = 1;
  function fitCanvas() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* ---- 配色（白天 / 夜晚两套） ---- */
  var SKY_DAY = '#f7f7f2', SKY_NIGHT = '#191b22';
  var INK_DAY = '#3b3f46', INK_NIGHT = '#e8eaf0';
  var theme = { sky: SKY_DAY, ink: INK_DAY, night: 0 };

  /* ---- 状态 ---- */
  var phase = 'title';                 // title | playing | won | lost
  var elapsed = 0, score = 0, speed = 360;
  var lives = START_LIVES;
  var invuln = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem('dino_human_best') || '0', 10) || 0; } catch (e) { best = 0; }

  var hero = { x: 150, y: GROUND, vy: 0, onGround: true, duck: false, size: 148, blink: 0 };
  var enemies = [], coins = [], clouds = [], dunes = [], pebbles = [];
  var spawnTimer = 1.2, coinTimer = 2.0, runTime = 0;

  /* ---- 音效（WebAudio 现场合成，不依赖外部文件） ---- */
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol == null ? 0.05 : vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* 无音频环境时静默 */ }
  }
  function sndJump() { beep(520, 0.11, 'square', 0.045); }
  function sndCoin() { beep(880, 0.07, 'triangle', 0.05); setTimeout(function () { beep(1180, 0.09, 'triangle', 0.04); }, 55); }
  function sndHit() { beep(150, 0.22, 'sawtooth', 0.07); }

  /* ---- 初始化场景元素 ---- */
  function seedScenery() {
    clouds = [];
    for (var i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 60 + Math.random() * 150, s: 0.6 + Math.random() * 0.8 });
    dunes = [];
    for (var j = 0; j < 7; j++) dunes.push({ x: j * 190 + Math.random() * 60, w: 200 + Math.random() * 160, h: 26 + Math.random() * 40 });
    pebbles = [];
    for (var k = 0; k < 16; k++) {
      pebbles.push({
        x: Math.random() * W,
        y: GROUND + 16 + Math.random() * 76,
        len: 5 + Math.random() * 11,
        a: 0.25 + Math.random() * 0.45
      });
    }
  }
  seedScenery();

  /* ---- 开始 / 重开 ---- */
  function reset() {
    phase = 'playing';
    elapsed = 0; score = 0; speed = 360; runTime = 0;
    lives = START_LIVES; invuln = 0;
    hero.y = GROUND; hero.vy = 0; hero.onGround = true; hero.duck = false;
    enemies = []; coins = [];
    spawnTimer = 1.1; coinTimer = 2.2;
    theme.night = 0;
    seedScenery();
  }
  function startIfNeeded() {
    if (phase === 'title' || phase === 'lost' || phase === 'won') {
      reset();
      if (actx && actx.state === 'suspended') actx.resume();
    }
  }

  /* ---- 输入 ---- */
  var jumpCount = 0;
  function doJump() {
    if (phase === 'title' || phase === 'lost') { startIfNeeded(); return; }
    if (hero.onGround) {
      hero.vy = JUMP_V; hero.onGround = false; hero.duck = false;
      jumpCount++;
      sndJump();
    }
  }
  function setDuck(on) {
    if (phase !== 'playing') return;
    hero.duck = on;
    if (on && !hero.onGround && hero.vy < FASTFALL * 0.35) hero.vy += FASTFALL * 0.5;
  }
  /* ---- 输入：同时认 e.key 和 e.code，避免中文输入法/部分浏览器下空格拿不到 ---- */
  function isJumpKey(e) {
    var k = e.key || '', c = e.code || '', n = e.keyCode || 0;
    return k === ' ' || k === 'Spacebar' || k === 'Space' || c === 'Space' || n === 32 ||
      k === 'ArrowUp' || c === 'ArrowUp' || n === 38 ||
      k === 'w' || k === 'W' || c === 'KeyW' ||
      k === 'Enter' || c === 'Enter' || k === 'NumpadEnter' || n === 13;
  }
  function isDuckKey(e) {
    var k = e.key || '', c = e.code || '', n = e.keyCode || 0;
    return k === 'ArrowDown' || c === 'ArrowDown' || n === 40 ||
      k === 's' || k === 'S' || c === 'KeyS';
  }

  window.addEventListener('keydown', function (e) { handleKey(e); }, { passive: false });
  document.addEventListener('keydown', function (e) { handleKey(e); }, { passive: false });

  // 诊断开关：URL 带 ?debug=1
  var DEBUG = (typeof location !== 'undefined' && String(location.search).indexOf('debug') >= 0);

  // window 与 document 都挂了监听，同一个事件对象只处理一次
  var keyCount = 0;
  function handleKey(e) {
    if (e.__dinoDone) return;
    e.__dinoDone = true;
    if (!inputArmed()) return;
    keyCount++;
    if (DEBUG) console.log('[dino] key="' + e.key + '" code="' + e.code + '" phase=' + phase + ' ground=' + hero.onGround);
    if (isJumpKey(e)) {
      e.preventDefault();
      if (phase === 'title' || phase === 'lost') startIfNeeded();
      else doJump();
      return;
    }
    if (isDuckKey(e)) { e.preventDefault(); setDuck(true); return; }
    var kk = e.key || '';
    if (kk === 'r' || kk === 'R') reset();
  }

  window.addEventListener('keyup', function (e) {
    if (isDuckKey(e)) setDuck(false);
  });
  document.addEventListener('keyup', function (e) {
    if (isDuckKey(e)) setDuck(false);
  });

  /* ---- 触摸 / 鼠标：点击=跳，下滑=蹲（手机上没有键盘） ---- */
  var touchY0 = -1, duckByTouch = false, movedFar = false;

  // 启动保护：加载后 350ms 内的输入忽略，避免浏览器重放/误触直接跳过标题
  var armAt = (typeof performance !== 'undefined' ? performance.now() : Date.now()) + 350;
  function inputArmed() {
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    return now >= armAt;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    grabFocus();
    if (!inputArmed()) return;
    touchY0 = (typeof e.clientY === 'number') ? e.clientY : -1;
    duckByTouch = false;
    movedFar = false;
    if (phase === 'title' || phase === 'lost') startIfNeeded();
    else doJump();
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (touchY0 < 0 || duckByTouch) return;
    var dy = (typeof e.clientY === 'number' ? e.clientY : touchY0) - touchY0;
    if (dy > 34) {
      duckByTouch = true;
      movedFar = true;
      // 空中下滑就地快速落地，落地后保持蹲姿
      if (!hero.onGround) hero.vy = Math.max(hero.vy, 900);
      setDuck(true);
    }
  }, { passive: false });

  function endTouch() {
    if (duckByTouch) { setDuck(false); duckByTouch = false; }
    touchY0 = -1;
  }
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);

  // 极老内核没有 PointerEvent 时退回 touch 事件
  if (!window.PointerEvent) {
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      grabFocus();
      var t = e.changedTouches[0];
      touchY0 = t ? t.clientY : -1;
      duckByTouch = false;
      if (phase === 'title' || phase === 'lost') startIfNeeded();
      else doJump();
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      if (touchY0 < 0 || duckByTouch) return;
      var t = e.changedTouches[0];
      if (t && t.clientY - touchY0 > 34) {
        duckByTouch = true;
        if (!hero.onGround) hero.vy = Math.max(hero.vy, 900);
        setDuck(true);
      }
    }, { passive: false });
    canvas.addEventListener('touchend', endTouch);
    canvas.addEventListener('touchcancel', endTouch);
  }

  /* ---- 竖屏提示：横屏更爽，点一下继续 ---- */
  (function setupRotateHint() {
    if (typeof document === 'undefined') return;
    try {
      var st = document.createElement('style');
      st.textContent =
        '#rot-hint{position:fixed;left:0;top:0;right:0;bottom:0;z-index:99;' +
        'background:rgba(18,20,24,.9);display:none;flex-direction:column;' +
        'align-items:center;justify-content:center;color:#fff;text-align:center;' +
        'padding:24px;font:600 22px/1.7 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}' +
        '#rot-hint .ri{font-size:56px;margin-bottom:6px;transform:rotate(-14deg)}' +
        '#rot-hint .rs{font-size:14px;opacity:.6;margin-top:10px;font-weight:400}';
      document.head.appendChild(st);
      var hint = document.createElement('div');
      hint.id = 'rot-hint';
      hint.innerHTML = '<div class="ri">&#8635;</div><div>横过来玩更爽</div>' +
        '<div class="rs">点一下继续（竖屏也能玩，就是小一点）</div>';
      document.body.appendChild(hint);

      function isPortrait() {
        return window.innerHeight > window.innerWidth * 1.05;
      }
      function refresh() {
        if (hint.dataset.dismissed === '1') { hint.style.display = 'none'; return; }
        hint.style.display = isPortrait() ? 'flex' : 'none';
      }
      hint.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        hint.dataset.dismissed = '1';
        hint.style.display = 'none';
        grabFocus();
      }, { passive: false });
      window.addEventListener('resize', refresh);
      window.addEventListener('orientationchange', function () { setTimeout(refresh, 120); });
      refresh();
    } catch (err) { /* 装饰层失败不影响游戏 */ }
  })();

  // 首次加载与每次点击都把焦点抢过来，否则 iframe / 内嵌预览里键盘事件到不了 window
  function grabFocus() {
    try {
      window.focus();
      if (canvas.focus) canvas.focus();
    } catch (err) { /* 被浏览器策略拦下就靠点击 */ }
  }
  setTimeout(grabFocus, 60);
  window.addEventListener('load', grabFocus);

  // 诊断：debug 模式下把状态写进 title 与 console
  if (DEBUG) {
    setInterval(function () {
      document.title = 'DINO|' + phase + '|y=' + Math.round(hero.y) +
        '|g=' + (hero.onGround ? 1 : 0) + '|k=' + keyCount + '|c=' + jumpCount;
    }, 120);
    console.log('[dino] debug on, phase=' + phase);
  }

  /* ---- 障碍生成 ---- */
  function spawnEnemy() {
    var r = Math.random();
    var type, w, h, y, needDuck = false;
    if (score > 420 && r < 0.26) {
      // 飞鸟：低飞要跳，高飞要蹲
      needDuck = Math.random() < 0.5;
      type = needDuck ? 'bird-high' : 'bird-low';
      w = 78; h = 52;
      y = needDuck ? GROUND - 166 : GROUND - 82;
    } else if (score > 180 && r < 0.55) {
      type = 'cactus-big'; w = 58; h = 112;
      y = GROUND;
    } else if (score > 60 && r < 0.75) {
      type = 'cactus-double'; w = 78; h = 78;
      y = GROUND;
    } else {
      type = 'cactus-small'; w = 38; h = 70;
      y = GROUND;
    }
    enemies.push({ x: W + 40, y: y, w: w, h: h, type: type, alive: true });
  }
  function spawnCoin() {
    var n = 1 + Math.floor(Math.random() * 3);
    var baseY = Math.random() < 0.45 ? GROUND - 212 : GROUND - 132;
    for (var i = 0; i < n; i++) coins.push({ x: W + 40 + i * 52, y: baseY, r: 21, got: false, t: 0 });
  }

  /* ---- 更新 ---- */
  function update(dt) {
    runTime += dt;

    // 场景滚动
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x -= dt * (14 + speed * 0.02) * clouds[c].s;
      if (clouds[c].x < -160) { clouds[c].x = W + 100; clouds[c].y = 50 + Math.random() * 160; }
    }
    for (var d = 0; d < dunes.length; d++) {
      dunes[d].x -= dt * speed * 0.06;
      if (dunes[d].x < -dunes[d].w) { dunes[d].x = W + Math.random() * 120; dunes[d].h = 24 + Math.random() * 44; }
    }
    for (var f = 0; f < pebbles.length; f++) {
      pebbles[f].x -= dt * speed * 0.96;
      if (pebbles[f].x < -24) {
        pebbles[f].x = W + Math.random() * 70;
        pebbles[f].y = GROUND + 16 + Math.random() * 76;
        pebbles[f].len = 5 + Math.random() * 11;
      }
    }

    if (phase !== 'playing' && phase !== 'won') return;

    elapsed += dt;
    // 速度随分数线性上升，封顶
    speed = Math.min(940, 360 + elapsed * 11);
    score += dt * (speed / 42);
    if (invuln > 0) invuln -= dt;

    // 昼夜：分数分段切换，插值过渡
    var targetNight = Math.floor(score / 450) % 2 === 1 ? 1 : 0;
    theme.night += (targetNight - theme.night) * Math.min(1, dt * 2.2);

    // 主角物理
    if (!hero.onGround) {
      hero.vy += GRAV * dt;
      hero.y += hero.vy * dt;
      if (hero.y >= GROUND) { hero.y = GROUND; hero.vy = 0; hero.onGround = true; }
    }

    // 生成
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      var gap = Math.max(0.62, 1.45 - speed / 1500) * (0.8 + Math.random() * 0.55);
      spawnTimer = gap;
    }
    coinTimer -= dt;
    if (coinTimer <= 0) { spawnCoin(); coinTimer = 2.2 + Math.random() * 2.6; }

    // 障碍移动与碰撞
    var heroBox = heroBoxOf();
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.x -= speed * dt;
      if (e.type === 'bird-high' || e.type === 'bird-low') e.y += Math.sin(runTime * 6 + e.x * 0.02) * 6 * dt * 6;
      if (e.x + e.w < -60) { enemies.splice(i, 1); continue; }
      if (invuln <= 0 && overlaps(heroBox, enemyBox(e))) {
        lives -= 1;
        invuln = 1.25;
        sndHit();
        if (lives <= 0) {
          phase = 'lost';
          if (score > best) { best = Math.floor(score); try { localStorage.setItem('dino_human_best', String(best)); } catch (er) {} }
        }
      }
    }

    // 金币
    var hb2 = heroBoxOf();
    for (var j = coins.length - 1; j >= 0; j--) {
      var co = coins[j];
      co.x -= speed * dt; co.t += dt;
      if (co.x < -40) { coins.splice(j, 1); continue; }
      var dx = (co.x) - (hb2.x + hb2.w / 2), dy = (co.y) - (hb2.y + hb2.h / 2);
      if (Math.abs(dx) < hb2.w / 2 + co.r && Math.abs(dy) < hb2.h / 2 + co.r) {
        coins.splice(j, 1); score += 25; sndCoin();
      }
    }

    // 达标
    if (phase === 'playing' && elapsed >= RUN_SECONDS) {
      phase = 'won';
      if (score > best) { best = Math.floor(score); try { localStorage.setItem('dino_human_best', String(best)); } catch (er) {} }
    }
  }

  function heroBoxOf() {
    var h = hero.duck ? hero.size * 0.55 : hero.size * 0.92;
    var w = hero.size * (hero.duck ? 0.72 : 0.44);
    return { x: hero.x - w / 2, y: hero.y - h, w: w, h: h };
  }
  function enemyBox(e) {
    var pad = e.type.indexOf('bird') === 0 ? 8 : 7;
    if (e.type.indexOf('cactus') === 0) {
      return { x: e.x + pad, y: e.y - e.h + 4, w: e.w - pad * 2, h: e.h - 4 };
    }
    return { x: e.x + pad, y: e.y - e.h / 2, w: e.w - pad * 2, h: e.h - pad };
  }
  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* ---- 角色绘制：中心在 (0,0)，总高约 size ---- */
  /* ---- 角色绘制：中心 (0,0)，总高约 size，脚底在 +size/2 ----
   * 身体是代码画的卡通告白：灰卫衣 + 黑T恤 + 黑裤 + 白鞋；
   * 脑袋用从用户照片裁出来的贴图（headImg），加载不到时退回代码头像。 */
  function drawPerson(g, size, o) {
    o = o || {};
    var t = o.t || 0;
    var pose = o.pose || 'run';
    var s = size / 100;

    var SKIN = '#f0c6a4', SKIN_SH = '#d9a982';
    var HOODY = '#c4c8d0', HOODY_D = '#7f8590';
    var SHIRT = '#17181c';
    var PANTS = '#23252b', PANTS_F = '#2f3239';
    var SHOE = '#f7f7f5', SHOE_SH = '#b6b8b5';

    g.save();
    g.scale(s, s);

    var th = t * 15;
    var leanRot = pose === 'jump' ? 0.16
      : pose === 'duck' ? 0.68
      : pose === 'hurt' ? -0.14
      : 0.21;

    /* 两段 IK：给定脚/手的位置，反解膝/肘 */
    function ik(fx, fy, ax, ay, L, color, w, endColor, endR, kneeForward) {
      var dx = fx - ax, dy = fy - ay;
      var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      var maxD = L * 2 - 0.6;
      if (d > maxD) { var k = maxD / d; dx *= k; dy *= k; d = maxD; }
      var a = d / 2;
      var h = Math.sqrt(Math.max(0, L * L - a * a));
      var ux = dx / d, uy = dy / d;
      var px = ax + ux * a, py = ay + uy * a;
      var jx = kneeForward ? px + uy * h : px - uy * h;
      var jy = kneeForward ? py - ux * h : py + ux * h;
      g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(jx, jy); g.lineTo(ax + dx, ay + dy); g.stroke();
      if (endR > 0) {
        g.fillStyle = endColor;
        g.beginPath();
        if (endR > 7) g.ellipse(ax + dx + endR * 0.35, ay + dy, endR, endR * 0.6, 0, 0, TAU);
        else g.arc(ax + dx, ay + dy, endR, 0, TAU);
        g.fill();
      }
      return { x: ax + dx, y: ay + dy };
    }

    /* ---- 脚的位置 ---- */
    var ffx, ffy, bfx, bfy;
    if (pose === 'jump') {
      ffx = 16; ffy = 33; bfx = -12; bfy = 37;
    } else if (pose === 'duck') {
      ffx = 18; ffy = 49; bfx = -6; bfy = 49;
    } else if (pose === 'hurt') {
      ffx = 18; ffy = 52; bfx = -15; bfy = 50;
    } else {
      ffx = Math.sin(th) * 15;
      ffy = 50 - Math.max(0, Math.cos(th)) * 16;
      bfx = Math.sin(th + Math.PI) * 15;
      bfy = 50 - Math.max(0, Math.cos(th + Math.PI)) * 16;
    }

    /* ---- 手的位置（与腿反相） ---- */
    var swF = pose === 'run' ? Math.sin(th) : (pose === 'jump' ? 1 : 0.5);
    var swB = pose === 'run' ? Math.sin(th + Math.PI) : (pose === 'jump' ? -1 : -0.5);
    var handFy = pose === 'jump' ? -16 : (pose === 'duck' ? -2 : 0);
    var handBy = pose === 'jump' ? -10 : (pose === 'duck' ? 2 : 4);

    /* ---- 后腿 ---- */
    g.save(); g.translate(-3.5, 0);
    ik(bfx, bfy, 0, 12, 20, PANTS, 10, SHOE_SH, 8.5, true);
    g.restore();

    /* ---- 后臂（在身体后面，先画） ---- */
    g.save();
    g.translate(0, 11); g.rotate(leanRot); g.translate(0, -11);
    ik(-4 + swB * 17, handBy + 2, -2, -17, 13, HOODY_D, 10, SKIN_SH, 4.6, false);
    g.restore();

    /* ===== 上身（绕髋部前倾） ===== */
    g.save();
    g.translate(0, 11); g.rotate(leanRot); g.translate(0, -11);

    // 卫衣
    g.fillStyle = HOODY; g.strokeStyle = '#8b9098'; g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(-13, -22); g.quadraticCurveTo(-17.5, -6, -14, 11);
    g.lineTo(14, 11); g.quadraticCurveTo(17.5, -6, 13, -22);
    g.quadraticCurveTo(0, -26, -13, -22); g.closePath(); g.fill(); g.stroke();

    // 帽子
    g.fillStyle = HOODY_D;
    g.beginPath();
    g.moveTo(-11, -22); g.quadraticCurveTo(-23, -13, -18, 4);
    g.quadraticCurveTo(-13, -6, -10, -14); g.closePath(); g.fill();

    // 拉链
    g.strokeStyle = '#eaecf0'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-1, -20); g.lineTo(-1, 10); g.stroke();

    // 黑 T 恤
    g.fillStyle = SHIRT;
    g.beginPath();
    g.moveTo(-1.5, -19); g.lineTo(11, -18); g.lineTo(12, 7); g.lineTo(4, 5); g.closePath(); g.fill();
    g.fillStyle = '#dcdee3';
    for (var q = 0; q < 5; q++) g.fillRect(2.2 + q * 1.9, -5, 1.1, 1.1);

    g.restore();

    /* ---- 前腿 ---- */
    g.save(); g.translate(3.5, 0);
    ik(ffx, ffy, 0, 11, 20, PANTS_F, 11, SHOE, 9, true);
    g.restore();

    /* ---- 前臂（在身体前面） ---- */
    g.save();
    g.translate(0, 11); g.rotate(leanRot); g.translate(0, -11);
    ik(5 + swF * 17, handFy + 2, 2, -17, 13, HOODY, 11, SKIN, 5, false);

    /* ---- 脖子 + 头 ---- */
    g.fillStyle = SKIN_SH;
    g.fillRect(-4.5, -21, 9, 11);

    var bob = pose === 'run' ? Math.sin(th * 2) * 0.9 : 0;
    if (headImg && headImg.complete && headImg.naturalWidth > 0) {
      var hs = 40;
      g.save();
      g.translate(1, -27 + bob);
      g.rotate(pose === 'run' ? Math.sin(th) * 0.025 : 0);
      g.drawImage(headImg, -hs / 2, -hs / 2, hs, hs);
      g.restore();
    } else {
      g.fillStyle = SKIN;
      g.beginPath(); g.ellipse(1, -28 + bob, 13, 14, 0, 0, TAU); g.fill();
      g.fillStyle = '#1c1b20';
      g.beginPath(); g.ellipse(1, -37 + bob, 13.5, 8.5, 0, 0, TAU); g.fill();
      g.strokeStyle = '#6f757e'; g.lineWidth = 1.6;
      g.beginPath(); g.rect(-1, -32 + bob, 12, 8); g.stroke();
      g.fillStyle = '#2a2a2f';
      g.beginPath(); g.arc(5, -28 + bob, 2, 0, TAU); g.fill();
    }

    g.restore();   /* 上身 */
    g.restore();   /* 整体 */
  }

  /* ---- 障碍 / 金币 / 背景绘制 ---- */
  function drawCactus(g, x, y, w, h, kind) {
    g.save();
    g.translate(x, y);
    var body = '#3f7d4f', dark = '#2c5a38', lite = '#79b07f';
    g.fillStyle = body; g.strokeStyle = dark; g.lineWidth = 2;
    var cols = kind === 'cactus-double' ? 2 : 1;
    for (var i = 0; i < cols; i++) {
      var ox = cols === 1 ? 0 : (i === 0 ? -9 : 8);
      var hh = cols === 1 ? h : h * (i === 0 ? 0.86 : 1);
      var ww = cols === 1 ? w : w * 0.46;
      g.beginPath();
      if (g.roundRect) g.roundRect(ox - ww / 2, -hh, ww, hh, ww * 0.45);
      else g.rect(ox - ww / 2, -hh, ww, hh);
      g.fill(); g.stroke();
      // 手臂
      g.beginPath();
      g.moveTo(ox - ww / 2, -hh * 0.62);
      g.quadraticCurveTo(ox - ww / 2 - 9, -hh * 0.62, ox - ww / 2 - 9, -hh * 0.78);
      g.stroke();
      g.beginPath();
      g.moveTo(ox + ww / 2, -hh * 0.48);
      g.quadraticCurveTo(ox + ww / 2 + 8, -hh * 0.48, ox + ww / 2 + 8, -hh * 0.66);
      g.stroke();
      // 高光
      g.strokeStyle = lite; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(ox - ww * 0.22, -hh + 8); g.lineTo(ox - ww * 0.22, -6); g.stroke();
      g.strokeStyle = dark; g.lineWidth = 2;
    }
    g.restore();
  }

  function drawBird(g, x, y, t, flap) {
    g.save();
    g.translate(x, y);
    g.fillStyle = '#4a4e58'; g.strokeStyle = '#2a2d34'; g.lineWidth = 2;
    var wy = Math.sin(t * 16) * (flap ? 7 : 3);
    g.beginPath();
    g.moveTo(-16, 0); g.quadraticCurveTo(-2, -10 - wy, 14, -2); g.quadraticCurveTo(0, 4 + wy, -16, 0);
    g.fill(); g.stroke();
    g.beginPath(); g.ellipse(2, 0, 11, 7, 0, 0, TAU); g.fill(); g.stroke();
    // 喙
    g.fillStyle = '#d9a13f';
    g.beginPath(); g.moveTo(12, -1); g.lineTo(21, 2); g.lineTo(12, 4); g.closePath(); g.fill();
    // 眼
    g.fillStyle = '#fff'; g.beginPath(); g.arc(6, -2, 2.2, 0, TAU); g.fill();
    g.fillStyle = '#22242a'; g.beginPath(); g.arc(6.6, -2, 1.1, 0, TAU); g.fill();
    g.restore();
  }

  function drawCoin(g, x, y, r, t) {
    var sc = Math.abs(Math.cos(t * 4));
    g.save();
    g.translate(x, y);
    g.scale(Math.max(0.25, sc), 1);
    g.fillStyle = '#f5c33f'; g.strokeStyle = '#b8860b'; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.stroke();
    g.strokeStyle = '#fff2b8'; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, r * 0.55, 0, TAU); g.stroke();
    g.restore();
  }

  /* ---- 主渲染 ---- */
  function render() {
    var night = theme.night;
    // 天空
    ctx.fillStyle = mix(SKY_DAY, SKY_NIGHT, night);
    ctx.fillRect(0, 0, W, H);

    var ink = mix(INK_DAY, INK_NIGHT, night);
    var inkSoft = mix('#9aa0a8', '#4a4f5c', night);

    // 云
    ctx.fillStyle = mix('#ffffff', '#2a2e3a', night);
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      ctx.beginPath();
      ctx.ellipse(cl.x, cl.y, 34 * cl.s, 15 * cl.s, 0, 0, TAU);
      ctx.ellipse(cl.x + 26 * cl.s, cl.y + 4 * cl.s, 24 * cl.s, 12 * cl.s, 0, 0, TAU);
      ctx.ellipse(cl.x - 24 * cl.s, cl.y + 5 * cl.s, 20 * cl.s, 10 * cl.s, 0, 0, TAU);
      ctx.fill();
    }

    // 远景沙丘
    ctx.fillStyle = mix('#e8e8df', '#20232c', night);
    for (var d = 0; d < dunes.length; d++) {
      var du = dunes[d];
      ctx.beginPath();
      ctx.moveTo(du.x, GROUND);
      ctx.quadraticCurveTo(du.x + du.w * 0.5, GROUND - du.h, du.x + du.w, GROUND);
      ctx.closePath(); ctx.fill();
    }

    // 地面线
    ctx.strokeStyle = ink;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

    // 地面小石子（断续短线，Chrome dino 那种纹理）
    for (var f = 0; f < pebbles.length; f++) {
      var pb = pebbles[f];
      ctx.strokeStyle = 'rgba(' + (theme.night > 0.5 ? '150,156,170' : '120,124,132') + ',' + pb.a.toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pb.x, pb.y); ctx.lineTo(pb.x + pb.len, pb.y);
      ctx.stroke();
    }
    // 地面双线（上沿加一条淡线）
    ctx.strokeStyle = 'rgba(' + (theme.night > 0.5 ? '120,126,140' : '150,154,162') + ',0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, GROUND + 7); ctx.lineTo(W, GROUND + 7); ctx.stroke();

    // 金币
    for (var c = 0; c < coins.length; c++) drawCoin(ctx, coins[c].x, coins[c].y, coins[c].r, coins[c].t);

    // 障碍
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (en.type.indexOf('cactus') === 0) drawCactus(ctx, en.x + en.w / 2, en.y, en.w, en.h, en.type);
      else drawBird(ctx, en.x + en.w / 2, en.y, runTime, true);
    }

    // 主角
    var blink = invuln > 0 && Math.floor(invuln * 14) % 2 === 0;
    if (phase !== 'title') {
    ctx.save();
    ctx.globalAlpha = blink ? 0.35 : 1;
    // 影子
    ctx.fillStyle = 'rgba(60,64,72,0.16)';
    var shScale = hero.onGround ? 1 : Math.max(0.35, 1 - (GROUND - hero.y) / 260);
    ctx.beginPath();
    ctx.ellipse(hero.x, GROUND + 7, 36 * shScale, 8.5 * shScale, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(hero.x, hero.y - hero.size * 0.5);
    if (phase === 'lost') {
      ctx.rotate(-0.28);
    }
    var pose = 'run';
    if (phase === 'lost') pose = 'hurt';
    else if (hero.duck && hero.onGround) pose = 'duck';
    else if (!hero.onGround) pose = 'jump';
    drawPerson(ctx, hero.size, { t: runTime, pose: pose });
    ctx.restore();
    ctx.restore();
    }

    // HUD
    drawHUD(ink, inkSoft);

    // 遮罩画面
    if (phase === 'title') drawTitle(ink);
    else if (phase === 'lost') drawOver(ink, false);
    else if (phase === 'won') drawOver(ink, true);
  }

  function drawHUD(ink, inkSoft) {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = ink;
    ctx.font = '600 26px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(String(Math.floor(score)).padStart(5, '0'), 28, 24);
    ctx.font = '500 14px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = inkSoft;
    ctx.fillText('HI ' + String(best).padStart(5, '0'), 30, 58);

    // 生命
    ctx.textAlign = 'right';
    for (var i = 0; i < START_LIVES; i++) {
      var on = i < lives;
      ctx.globalAlpha = on ? 1 : 0.22;
      ctx.fillStyle = on ? '#e0524c' : inkSoft;
      var hx = W - 30 - i * 26, hy = 34;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 7);
      ctx.bezierCurveTo(hx - 11, hy - 2, hx - 6, hy - 12, hx, hy - 5);
      ctx.bezierCurveTo(hx + 6, hy - 12, hx + 11, hy - 2, hx, hy + 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 进度条（跑到 60 秒）
    if (phase === 'playing' || phase === 'won') {
      var p = Math.min(1, elapsed / RUN_SECONDS);
      ctx.fillStyle = 'rgba(120,124,132,0.25)';
      ctx.fillRect(W / 2 - 150, 30, 300, 6);
      ctx.fillStyle = ink;
      ctx.fillRect(W / 2 - 150, 30, 300 * p, 6);
    }
    ctx.restore();
  }

  function drawTitle(ink) {
    ctx.save();
    ctx.fillStyle = 'rgba(247,247,242,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 68px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText('秦硕跑酷', W / 2, H / 2 - 86);
    ctx.font = '500 20px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = mix('#5a6068', '#e8eaf0', theme.night);
    ctx.fillText('点击 / 空格 = 跳　　下滑 / ↓ = 蹲下躲飞鸟', W / 2, H / 2 - 20);
    ctx.fillText('撞到障碍掉 1 颗心，撑满 ' + RUN_SECONDS + ' 秒算通关', W / 2, H / 2 + 12);
    var pulse = 0.55 + Math.sin(performance.now() / 320) * 0.35;
    // 明显的按钮，逼用户点一下 —— 点完 iframe / 内嵌预览才拿得到键盘
    var bw = 300, bh = 62, bx = W / 2 - bw / 2, by = H / 2 + 50;
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#e0524c';
    roundRect(bx, by, bw, bh, 31); ctx.fill();
    ctx.globalAlpha = pulse * 0.5 + 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 26px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText('点击开始', W / 2, by + bh / 2 + 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = mix('#8b9099', '#aab0bb', theme.night);
    ctx.font = '500 15px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText('键盘要先点一下画面才有反应（内嵌预览里尤其如此）', W / 2, by + bh + 26);
    ctx.restore();
  }

  function drawOver(ink, win) {
    ctx.save();
    ctx.fillStyle = win ? 'rgba(247,247,242,0.86)' : 'rgba(30,32,38,0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fg = win ? mix('#3b3f46', '#e8eaf0', theme.night) : '#f2f3f6';
    ctx.fillStyle = fg;
    ctx.font = '700 46px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText(win ? '通 关' : '被 拦 住 了', W / 2, H / 2 - 74);
    ctx.font = '600 30px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('SCORE ' + String(Math.floor(score)).padStart(5, '0'), W / 2, H / 2 - 12);
    ctx.font = '500 18px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillStyle = win ? mix('#5a6068', '#cfd3dc', theme.night) : '#c9ccd3';
    ctx.fillText('最高分 ' + best + '　　跑了 ' + elapsed.toFixed(1) + ' 秒', W / 2, H / 2 + 26);
    var pulse = 0.55 + Math.sin(performance.now() / 320) * 0.35;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = win ? '#3f7d4f' : '#ff8f6b';
    ctx.font = '600 22px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
    ctx.fillText('空格 / 点击 = 再来一局', W / 2, H / 2 + 86);
    ctx.restore();
  }

  function mix(a, b, t) {
    var ca = hex(a), cb = hex(b);
    var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
    var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
    var bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  /* ---- 主循环：固定步长 1/60 ---- */
  var last = 0, acc = 0, fps = 60, fpsAcc = 0, fpsFrames = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    acc += dt;
    var step = 1 / 60;
    var guard = 0;
    while (acc >= step && guard < 6) { update(step); acc -= step; guard++; }
    if (guard >= 6) acc = 0;

    fpsAcc += dt; fpsFrames++;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; }

    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= 对外接口（playtest / 侧栏缩略图读取） ================= */

  window.__gameState = function () {
    return {
      phase: phase,
      score: Math.floor(score),
      best: best,
      hearts: lives,
      fps: fps,
      elapsed: +elapsed.toFixed(2),
      hero: { x: hero.x, y: hero.y },
      heroOnScreen: true,
      pickups: coins.map(function (c) { return { x: c.x, y: c.y }; }),
      enemies: enemies.map(function (e) { return { x: e.x + e.w / 2, y: e.y - e.h / 2, type: e.type }; }),
      world: { w: W, h: H }
    };
  };

  /* 自动试玩：见到障碍就跳，高飞的鸟就蹲 */
  window.__autoplay = function (state) {
    if (!state) return;
    if (state.phase !== 'playing') { startIfNeeded(); return; }
    var heroX = state.hero.x;
    var nearest = null, nd = 1e9;
    for (var i = 0; i < state.enemies.length; i++) {
      var e = state.enemies[i];
      var dx = e.x - heroX;
      if (dx < -20) continue;
      if (dx < nd) { nd = dx; nearest = e; }
    }
    if (nearest) {
      var react = 118 + speed * 0.09;
      if (nearest.type === 'bird-high') {
        if (nd < react * 0.8) setDuck(true);
        else setDuck(false);
      } else {
        setDuck(false);
        if (nd < react && hero.onGround) doJump();
      }
    } else {
      setDuck(false);
    }
  };

  /* 角色特写（侧栏缩略图与 playtest 的近景图） */
  window.__renderSlots = function (size) {
    var out = {};
    function cut(draw) {
      var c = document.createElement('canvas');
      c.width = c.height = size;
      var g = c.getContext('2d');
      g.clearRect(0, 0, size, size);
      draw(g, size);
      return c.toDataURL('image/png');
    }
    out.hero = cut(function (g, s) {
      g.save();
      g.translate(s / 2, s * 0.55);
      drawPerson(g, s * 0.94, { t: 0.13, pose: 'run' });
      g.restore();
    });
    out.enemy = cut(function (g, s) {
      g.save();
      g.translate(s / 2, s * 0.86);
      drawCactus(g, 0, 0, s * 0.24, s * 0.72, 'cactus-small');
      g.restore();
    });
    out.pickup = cut(function (g, s) {
      drawCoin(g, s / 2, s / 2, s * 0.18, 0.3);
    });
    out.background = cut(function (g, s) {
      g.fillStyle = SKY_DAY; g.fillRect(0, 0, s, s);
      g.fillStyle = '#e8e8df';
      g.beginPath();
      g.moveTo(0, s); g.quadraticCurveTo(s * 0.3, s * 0.62, s * 0.6, s); g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(s * 0.4, s); g.quadraticCurveTo(s * 0.75, s * 0.55, s, s * 0.98); g.closePath(); g.fill();
      g.strokeStyle = '#3b3f46'; g.lineWidth = Math.max(1, s * 0.012);
      g.beginPath(); g.moveTo(0, s * 0.86); g.lineTo(s, s * 0.86); g.stroke();
    });
    return out;
  };
})();
</script>
</body></html>
